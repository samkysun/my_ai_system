name: Auto Update Mark Six Data

on:
  schedule:
    # 每周二、四、六 UTC 14:00 (北京时间 22:00)
    - cron: '0 14 * * 2,4,6'
  workflow_dispatch: # 允许你在网页上手动点按钮测试

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: pip install requests openpyxl

      - name: 运行抓取脚本
        run: python scraper.py

      - name: 提交并推送更新
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # 🔥 改用 git add . 会自动添加所有发生更改的文件（包括你的Excel表）
          git add .
          git commit -m "Auto update data [skip ci]" || exit 0
          git push
