name: Auto Update Mark Six Data

on:
  schedule:
    - cron: '0 14 * * 2,4,6'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 必须有这个才能写入仓库
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: pip install requests openpyxl

      - name: 运行抓取脚本
        run: python scraper.py

      - name: 提交并推送更新
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto update Mark Six Data" || echo "没有文件变动"
          git push origin main
